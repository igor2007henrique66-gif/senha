<html>
    <head>
        <title>Firebase_form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="C:\Users\16162032698\Desktop\dragonball.png">
    </head>
    <body>
<div class="box">
    <div class="form">
    <h2>Login Form</h2>
    <form>
        <div class="inputbox">
            <input type="text" value="" id="username" placeholder="ex: Lisboa" required>
            <span>username</span>
        </div>
        <div class="inputbox">
            <input type="email" value="" id="email" placeholder="ex:Lisboa@gmail.com" required>
            <span>E-mail</span>
        </div>
        <div class="inputbox">
            <input type="text" value="" id="phone" placeholder="31 9 4002-8922" required>
            <span>Phone Number</span>
        </div>
        <input type="submit" value="submit" class="sub" id="submit">
      </form>
    </div>
</div>



 <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js"
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
  
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBG8PQcFZT332_P5nzvFchN-RZVcM8a7uM",
      authDomain: "fir-one-8fd04.firebaseapp.com",
      databaseURL: "https://fir-one-8fd04-default-rtdb.firebaseio.com",
      projectId: "fir-one-8fd04",
      storageBucket: "fir-one-8fd04.firebasestorage.app",
      messagingSenderId: "340684039968",
      appId: "1:340684039968:web:acc9676c91560661649945"
    };
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById("submit").addEventListener('click', function(e){
        e.preventDefault();
        set(ref(db, 'LisboaLindao/' + document.getElementById("username").value),
        {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            PhoneNumber: document.getElementById("phone").value
        });
        alert("Login Sucessfull  !");
    })
  </script>
  </body>
  </html>
